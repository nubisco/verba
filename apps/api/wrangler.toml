# Nubisco's hosted Verba (verba.nubisco.io) on Cloudflare Workers, with D1,
# static assets and a Durable Object for live updates. See
# docs/hosting-on-cloudflare.md. Self-hosters run the Docker image: this file
# describes the hosted instance only, and self-hosting on Workers is not
# supported.
#
# Local: `pnpm build` (the web app and the generated Prisma clients), copy
# .dev.vars.example to .dev.vars, then from apps/api:
#   pnpm exec wrangler d1 migrations apply verba --local
#   pnpm worker:dev
# Hosted deploys run from CI (the worker job in .github/workflows/docker.yml).
name = "verba"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
# Verba uses node:crypto, node:events and Buffer, and reads its settings from
# process.env, which the Worker fills from the vars and secrets (src/worker.ts).
compatibility_flags = ["nodejs_compat"]

# verba.nubisco.io, on the hostname Cloudflare already proxies. Added at cutover,
# 2026-11-04, when the NAS stopped serving it.
routes = [{ pattern = "verba.nubisco.io/*", zone_name = "nubisco.io" }]

# The web app. Only /api/* wakes the Worker. Any other path is a file from the
# build, or index.html, so a deep link loads the app.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "verba"
# Created at cutover on 2026-11-04 (region WEUR). A local D1 ignores it.
database_id = "a96b746d-61e4-4fd2-a283-a1e7d48e0572"
# Generated from prisma/schema.prisma by `pnpm db:d1:new`, checked in CI.
migrations_dir = "prisma/d1"

# Live updates: one object per account holds that account's open tabs.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveHub"]

# Background jobs: imports and AI fills, one chunk per message (src/jobs.ts).
# One message per invocation, so each chunk has D1's whole per-invocation
# query budget, and one invocation at a time, because D1 runs one query at a
# time anyway and a big import should not crowd out people's requests.
[[queues.producers]]
binding = "JOBS"
queue = "verba-jobs"

[[queues.consumers]]
queue = "verba-jobs"
max_batch_size = 1
max_concurrency = 1
max_retries = 3

# Hourly housekeeping: audit retention, expired codes, finished job chunks,
# and the 5 GB database size alert (src/services/maintenance.service.ts).
[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true

[vars]
NODE_ENV = "production"
ENABLE_EE = "true"
# Plans switch on only once the secrets VERBA_LICENSES_SERVICE_TOKEN and
# VERBA_ENTITLEMENT_WEBHOOK_SECRET are set too (docs/plans-and-billing.md).
VERBA_LICENSES_URL = "https://licenses.nubisco.io"
VERBA_SALES_URL = "https://nubisco.io/contact?product=verba&need=pre-sales"
# No checkout until the terms and pricing are published: limits and the
# read-only rules still apply, the billing page shows the plan, and nothing
# offers to buy (docs/plans-and-billing.md, "Switching it on").
VERBA_CHECKOUT_OPEN = "false"
# Sign-up is closed until Verba's terms are published, as Acta's was (LA-402).
# People who already have an account sign in as usual, and VERBA_OPERATORS
# addresses always can. Set the three terms variables below and then
# VERBA_SIGNUP_OPEN = "true" once nubisco.io/products/verba/terms and /privacy
# are live. A new VERBA_TERMS_VERSION asks everyone to accept again.
VERBA_SIGNUP_OPEN = "false"
# VERBA_TERMS_VERSION = "<date of the published terms>"
# VERBA_TERMS_URL = "https://nubisco.io/products/verba/terms"
# VERBA_PRIVACY_URL = "https://nubisco.io/products/verba/privacy"
# Sign-in codes come from auth@, kept apart from notification volume
# (AGENTS.md, "Transactional email"). Sent through Resend (RESEND_API_KEY).
MAIL_FROM = "Verba <auth@nubisco.io>"
# Sign-in through Accord, the same as the NAS ran.
PLATFORM_ISSUER = "https://auth.nubisco.io"
PLATFORM_AUTH_ORIGIN = "https://auth.nubisco.io"
PLATFORM_APP_ID = "nubisco-verba"
# Server-side product analytics, with the ANALYTICS_TOKEN secret.
ANALYTICS_URL = "https://analytics.nubisco.io"
# Secrets, set with `wrangler secret put <NAME>`, never here:
#   JWT_SECRET                        signs sessions (required)
#   AI_ENCRYPTION_KEY                 seals projects' AI provider keys
#   RESEND_API_KEY                    one-time codes by email
#   VERBA_OPERATORS                   operator emails, comma separated
#   VERBA_LICENSES_SERVICE_TOKEN      licenses' SERVICE_TOKEN_VERBA
#   VERBA_ENTITLEMENT_WEBHOOK_SECRET  licenses' ENTITLEMENT_WEBHOOK_SECRET_VERBA
#   OIDC_CLIENT_SECRET                if OIDC sign-in is used
#   ANALYTICS_TOKEN                   server-side product analytics

# The sign-in rate limits, per minute (decided by Jose, 2026-11-03). They must
# match WORKER_RATE_LIMITS in src/rate-limits.ts, which a test compares with
# this file. Verba's namespace ids are the 12xx range.
[[ratelimits]]
name = "VERBA_OTP_REQUEST_IP_LIMITER"
namespace_id = "1201"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "VERBA_OTP_REQUEST_EMAIL_LIMITER"
namespace_id = "1202"
simple = { limit = 2, period = 60 }

[[ratelimits]]
name = "VERBA_OTP_VERIFY_IP_LIMITER"
namespace_id = "1203"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "VERBA_OTP_VERIFY_EMAIL_LIMITER"
namespace_id = "1204"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "VERBA_LOGIN_IP_LIMITER"
namespace_id = "1205"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "VERBA_LOGIN_EMAIL_LIMITER"
namespace_id = "1206"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "VERBA_FEDERATED_IP_LIMITER"
namespace_id = "1207"
simple = { limit = 10, period = 60 }
