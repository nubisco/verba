name: Deploy

# Builds the multi-arch images after a release on master, pushes them to GHCR, and deploys them
# to the NAS.
#
# The image builds run on GitHub's runners and are the only part that executes repository code.
# The deploy job runs on a self-hosted runner and checks out nothing: it asks the NAS to deploy
# the sha- tag of the commit that was built, through a key that can run one deploy script and
# nothing else. The key and the host alias live on the runner, not in GitHub or in this
# repository, so nothing here describes how the NAS is set up.
#
# There is no manual trigger on purpose: only a merge to master deploys. To build again, re-run
# the workflow from the Actions tab.
#
# The runner group only lets this file run from master, so a pull request or another branch
# cannot reach the runner.
on:
  workflow_run:
    workflows: [Release]
    branches: [master]
    types: [completed]

env:
  REGISTRY: ghcr.io

# One at a time, and a newer release waits instead of cancelling a deploy in flight.
concurrency:
  group: verba-deploy
  cancel-in-progress: false

jobs:
  # Release may have pushed a version commit after the one that started this chain. Every job
  # below builds this one commit, so the images and the tag that gets deployed always match.
  prepare:
    name: Pin the commit
    # A branch called master in a fork must not start this, so the run has to be in this
    # repository, on master, and the release must have succeeded.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - name: Record the commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package }} (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: verba-api
            dockerfile: apps/api/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - package: verba-api
            dockerfile: apps/api/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
          - package: verba-ce
            dockerfile: apps/web/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - package: verba-ce
            dockerfile: apps/web/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from package.json
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/nubisco/${{ matrix.package }}

      - name: Push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.VERSION }}
            BUILD_HASH=${{ needs.prepare.outputs.sha }}
            VITE_ANALYTICS_URL=${{ vars.VITE_ANALYTICS_URL }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/nubisco/${{ matrix.package }},push-by-digest=true,name-canonical=true,push=true
          no-cache: true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.package }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create multi-arch manifest (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: [verba-api, verba-ce]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Get version from package.json
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.package }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha- plus 7 characters is the tag the deploy job pins, so the NAS runs one exact build.
      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/nubisco/${{ matrix.package }}:latest \
            -t ${{ env.REGISTRY }}/nubisco/${{ matrix.package }}:${{ steps.version.outputs.VERSION }} \
            -t ${{ env.REGISTRY }}/nubisco/${{ matrix.package }}:sha-${SHA:0:7} \
            $(printf '${{ env.REGISTRY }}/nubisco/${{ matrix.package }}@sha256:%s ' *)

  nas:
    name: Deploy to the NAS
    needs: [prepare, merge]
    runs-on: [self-hosted, nas-deploy]
    # The script's worst case is three 4-minute pull attempts, then stop, Build and the
    # health wait.
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      # The SSH key and the nas-deploy host alias live on the runner, not in GitHub, so only
      # a job on this runner can reach the NAS.
      - name: Deploy
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: ssh -o BatchMode=yes nas-deploy "verba sha-${SHA:0:7}"
