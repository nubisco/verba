name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest

    # A scratch PostgreSQL for the migration check below. Prisma replays the
    # migration history into it to compare it with the schema.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @nubisco/verba-api prisma:generate

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Verify the PostgreSQL migrations match the schema
        # A schema change without a migration would never reach production,
        # because the API image only applies prisma/migrations.
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:shadow@localhost:5432/postgres
        run: pnpm --filter @nubisco/verba-api db:migration:check

      - name: Verify forbidden EE imports in CE code
        run: |
          # ESLint already enforces this, but a grep backstop catches it even
          # if the lint step is accidentally skipped or the rule is weakened.
          VIOLATIONS=$(grep -rn --include='*.ts' --include='*.vue' \
            -e "from '@nubisco/verba-ee" -e "from \"@nubisco/verba-ee" \
            apps/ packages/shared/ packages/cli/ || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Forbidden EE imports found in CE code:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "No forbidden EE imports found."

      - name: Verify required legal files
        run: |
          MISSING=""
          for f in LICENSE LICENSE-AGPL.txt NOTICE.md packages/ee/LICENSE; do
            if [ ! -f "$f" ]; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required legal files:$MISSING"
            exit 1
          fi
          echo "All required legal files present."
